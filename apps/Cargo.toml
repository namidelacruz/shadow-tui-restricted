[package]
name = "shadow-apps"
version = "9.0.0"
edition = "2021"
description = "Shadow TUI Restricted applications, each its own 2D Wayland app: launcher, network, config, files, lock, updater"
license = "MIT"

[[bin]]
name = "shadow-launch"
path = "src/bin/launch.rs"

[[bin]]
name = "shadow-config"
path = "src/bin/config.rs"

[[bin]]
name = "shadow-net"
path = "src/bin/net.rs"

[[bin]]
name = "shadow-files"
path = "src/bin/files.rs"

[[bin]]
name = "shadow-lock"
path = "src/bin/lock.rs"

[[bin]]
name = "shadow-update"
path = "src/bin/update.rs"

[[bin]]
name = "shadow-flyout"
path = "src/bin/flyout.rs"

[[bin]]
name = "shadow-tasks"
path = "src/bin/tasks.rs"

[[bin]]
name = "shadow-fix"
path = "src/bin/fix.rs"

[[bin]]
name = "shadow-passfix"
path = "src/bin/passfix.rs"

[[bin]]
name = "shadow-craft"
path = "src/bin/craft.rs"

[[bin]]
name = "shadow-glyph"
path = "src/bin/glyph.rs"

[[bin]]
name = "shadow-webd"
path = "src/bin/webd.rs"

[[bin]]
name = "shadow-settings"
path = "src/bin/settings.rs"

[[bin]]
name = "shadow-installer"
path = "src/bin/installer.rs"

[[bin]]
name = "shadow-prefs"
path = "src/bin/prefs.rs"

[[bin]]
name = "shadow-wallpaper"
path = "src/bin/wallpaper.rs"

[dependencies]
shadow-ui = { path = "../ui" }
shadow-niri = { path = "../niri" }
libc = "0.2"
png = "0.17"
zune-jpeg = "0.4"
serde_json = "1"
