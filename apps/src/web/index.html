<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E0C09">
<title>Shadow Settings</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<svg class="vitruvian" viewBox="0 0 1000 1000" aria-hidden="true">
  <circle cx="500" cy="440" r="380"/>
  <rect x="188" y="196" width="624" height="624"/>
  <g class="rays"><path d="M500 60V820M120 440H880M231 171L769 709M769 171L231 709"/></g>
</svg>
<header>
  <div class="brand"><span class="mark">◇</span> SHADOW <span class="sub">SETTINGS</span></div>
  <nav id="tabs">
    <button data-p="settings">SETTINGS</button>
    <button data-p="fix">FIX CENTER</button>
    <button data-p="defaults">DEFAULT APPS</button>
    <button data-p="config">CONFIG</button>
    <button data-p="crash">CRASH LOG</button>
  </nav>
  <div id="who"></div>
</header>
<main id="main"><section class="page" id="page"></section><div class="tess" id="tess"></div></main>
<footer id="status">·</footer>
<template id="locked"><div class="locked"><h1>LOCKED</h1><p>This app talks only to the Shadow session that unlocked it. Open settings from Shadow — <b>Mod + Comma</b>, or a SETTINGS row in the right column — and it unlocks for this session.</p></div></template>
<script src="/app.js"></script>
</body>
</html>
