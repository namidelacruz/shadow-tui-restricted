[package]
name = "shadow-ui"
version = "8.3.0"
edition = "2021"
description = "Shadow TUI Restricted shared 2D UI toolkit: Wayland surfaces (window, layer, lock), fractional scaling with automatic text-size correction, CPU-rendered canvas, mapped fonts"
license = "MIT"

[dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-protocols = { version = "0.32", default-features = false, features = ["client", "staging"] }
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }
libc = "0.2"
toml = "0.8"
unicode-width = "0.2"
