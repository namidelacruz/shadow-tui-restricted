[package]
name = "shadow"
version = "8.0.2"
edition = "2021"
description = "Shadow TUI Restricted system tools: setup, greeter admin, Wi-Fi self-repair (shadow-netd), state sync (shadow-sync), Lua self-correction (shadow-healer), local AI, updates"
license = "MIT"

# std-only except the shared Lua sandbox (used by shadow-healer)
[dependencies]
shadow-lua = { path = "../lua" }
shadow-niri = { path = "../niri" }

[[bin]]
name = "shadow"
path = "src/main.rs"

