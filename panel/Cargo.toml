[package]
name = "shadow-panel"
version = "10.0.0"
edition = "2021"
description = "Shadow TUI Restricted: the shell's taskbar, start menu, widgets and quick settings — local web pages in frameless WebKitGTK layer-shell windows"
license = "MIT"

[[bin]]
name = "shadow-panel"
path = "src/main.rs"

[dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_5"] }
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
serde_json = "1"
shadow-niri = { path = "../niri" }
libc = "0.2"
