[package]
name = "shadow-compositor"
version = "6.0.0"
edition = "2021"
description = "Shadow TUI Restricted display server: independent Smithay Wayland compositor with the orbital ring layout, tactical shaders, bezel HUD, greeter and lock screen"
license = "MIT"

[dependencies]
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "backend_udev", "backend_drm", "backend_gbm", "backend_egl", "backend_libinput", "backend_session_libseat", "renderer_gl", "wayland_frontend", "desktop", "use_system_lib"] }
shadow-lua = { path = "../lua" }
fontdue = "0.9"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "shadow-compositor"
path = "src/main.rs"

[[bin]]
name = "shadowctl"
path = "src/bin/shadowctl.rs"
