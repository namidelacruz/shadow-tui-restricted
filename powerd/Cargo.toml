[package]
name = "shadow-powerd"
version = "8.2.2"
edition = "2021"
description = "Shadow Network hardware optimizer for the Dell 14 Plus (Lunar Lake): thermal modes, charging, refresh rate, audio, kernel guard, adaptive learning"
license = "MIT"

# std only: no crates, so it builds offline and survives any toolchain/package churn
[dependencies]

[[bin]]
name = "shadow-powerd"
path = "src/main.rs"

